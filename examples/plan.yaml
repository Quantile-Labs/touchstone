# yaml-language-server: $schema=https://touchstone.quantilelabs.com/schemas/plan.schema.json
# The plan the README walks through. Build the image it names first:
#
#     docker build -t example_pack:1.0 packs/example_pack
#
# 200 items over two replicates is 400 records, which is enough for a language cell to
# clear the minimum size a worst-stratum indicator should ever accept. The pack emits ten
# by default; a demonstration that cannot fill a stratum demonstrates the wrong thing.
#
plan_name: "demo"
access_tier: "black_box"
seed: 7

systems:
  chatbot:
    type: "llm_api"

packs:
  - id: "example_pack"
    image: "example_pack:1.0"
    systems:
      system_under_test: "chatbot"
    params:
      max_items: 200
    replicates: 2
