name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `pages` and `id-token` are what actions/deploy-pages needs: it authenticates to the
# Pages service with a short lived OIDC token rather than with a stored secret, so there
# is no credential in this repository to leak or rotate.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one that has started. Cancelling a half finished
# deployment leaves the site serving whichever build got furthest, which is a state nobody
# asked for and no commit describes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --group docs

      # --strict turns a broken internal link into a failed build. A pull request that
      # renames a page and leaves a link behind fails here rather than publishing a 404.
      - name: build the site, failing on a broken internal link
        run: uv run mkdocs build --strict

      - name: upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A pull request builds to prove it still builds. Only main publishes.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
