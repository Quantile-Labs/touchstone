[project]
name = "touchstone-dqi"
version = "0.0.1"
description = "Seal evaluation output into an evidence bundle anyone can re-check offline."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Quantile Labs" }]
maintainers = [{ name = "Quantile Labs" }]
keywords = ["evaluation", "ai-assurance", "audit", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/Quantile-Labs/touchstone"
Source = "https://github.com/Quantile-Labs/touchstone"

[project.scripts]
touchstone = "touchstone.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12", "mypy>=1.15", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src/touchstone"]
python_version = "3.12"
strict = true

# The Protocol in backends/base.py is the reason this runs. runtime_checkable was
# measured: isinstance passes a backend whose signatures are wrong, and only a missing
# method or a missing isolation attribute fails it. mypy is what makes it a contract.

[tool.pytest.ini_options]
testpaths = ["tests"]
