[project]
name = "touchstone-dqi"
version = "0.0.1"
description = "Run an AI evaluation and get a sealed evidence bundle anyone can re-check offline."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Quantile Labs" }]
keywords = ["evaluation", "ai-assurance", "audit", "reproducibility"]
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/Quantile-Labs/touchstone"
Source = "https://github.com/Quantile-Labs/touchstone"

[project.scripts]
touchstone = "touchstone.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
