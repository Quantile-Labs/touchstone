[project]
name = "dqi"
version = "0.0.1"
description = "Deployment Quality Index. Installs Touchstone, which computes it."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Quantile Labs" }]
maintainers = [{ name = "Quantile Labs" }]
keywords = ["dqi", "ai-evaluation", "ai-audit", "ai-assurance"]
dependencies = ["touchstone-dqi>=0.0.1"]

[project.urls]
Homepage = "https://github.com/Quantile-Labs/touchstone"
Source = "https://github.com/Quantile-Labs/touchstone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dqi"]
